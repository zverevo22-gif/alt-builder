# =====================================================================
#  Состав программного обеспечения дистрибутива
#
#  Все значения - пробелораздельные списки имён ПАКЕТОВ (binary rpm)
#  и/или СПИСКОВ пакетов. Пакеты задаются именами из репозитория,
#  списки - относительными путями к файлам в каталоге
#   profile/pkg.in/lists/custom/  (имя файла = имя списка),
#  например: THE_LISTS_EXTRA="custom/gnome-extra"
#
#  Пустая переменная = правка не выполняется.
#
#  Подробнее о стадиях (BASE/THE/MAIN/LIVE/INSTALL2) см. README.md,
#  раздел "Состав ПО: как это устроено".
# =====================================================================

# --- Установленная система и Live-сессия (стадия THE_*) --------------
# Пакеты, попадающие и в устанавливаемую систему по умолчанию,
# и в Live-сессию:
THE_PACKAGES_EXTRA=""

# Файлы-списки пакетов (см. profile/pkg.in/lists/custom/):
# Список "custom/gnome-extra" подключён по умолчанию — пакеты из него
# попадают и в Live-сессию, и в устанавливаемую систему. Имена пакетов
# прописывайте в profile/pkg.in/lists/custom/gnome-extra (по одному на строку).
THE_LISTS_EXTRA="custom/gnome-extra"

# --- Базовая система (стадия BASE_*) ---------------------------------
# Пакеты, которые обязаны присутствовать в системе "по умолчанию"
# (например, критичные сервисы). Используйте осторожно.
BASE_PACKAGES_EXTRA=""

# --- Пакеты на носителе (стадия MAIN_*) ------------------------------
# Пакеты, которые будут доступны для установки с диска/флешки
# (дополняют основной репозиторий media).
MAIN_PACKAGES_EXTRA=""

# --- Live-сессия (стадия LIVE_*) --------------------------------------
# Пакеты, попадающие в Live-образ, но не в устанавливаемую систему:
LIVE_PACKAGES_EXTRA=""
LIVE_LISTS_EXTRA=""

# --- Инсталлятор (стадия INSTALL2_*) ----------------------------------
# Пакеты, которые попадают в сам инсталлятор (alterator-superuser и т.п.),
# но не в устанавливаемую систему:
INSTALL2_PACKAGES_EXTRA=""

# --- Чёрный список пакетов --------------------------------------------
# Имена или фрагменты имён пакетов, которых не должно быть ни в одной
# стадии. Проверка выполняется на последней стадии сборки ISO по
# итоговому списку .disk/pkglist на образе. Маски не поддерживаются.
BLACKLIST_PKGS=""