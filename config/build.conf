# =====================================================================
#  Основные параметры сборки установочного образа ALT Linux GNOME
#
#  Файл читается скриптами сборки (scripts/build.sh и др.),
#  синтаксис строк: KEY="значение" либо KEY=значение.
#  Пустые значения означают "по умолчанию".
# =====================================================================

# Ветка дистрибутива, из репозитория которой собирается образ:
#   sisyphus  - постоянно обновляемая ветка (rolling)
#   p11       - стабильная ветка ALT Linux 11 (текущая, ядро 6.12)
#   p10       - стабильная ветка ALT Linux 10 (ядро un-def)
#   p9        - стабильная ветка ALT Linux 9 (устаревшая)
# ВНИМАНИЕ: полный состав пакетов и их происхождение определяются именно
# этой веткой (см. также USE_APTCONF ниже), а не хост-системой сборки.
BRANCH="p11"

# Источник пакетов для сборки:
#   1 - (по умолчанию) ЗАКРЕПЛЁННОЕ зеркало целевой ветки (mirror.yandex.ru
#       или APT_MIRROR, см. tools/make-aptconf.sh). Сборка не зависит от
#       apt-настроек и версии ALT на хост-системе, результат воспроизводим;
#   0 - собирать из репозиториев, настроенных на хост-системе
#       (/etc/apt/sources.list.d хост). НЕ рекомендуется: итоговые версии
#       пакетов зависят от того, на какой машине выполняется сборка.
USE_APTCONF="1"

# Зеркало ветки по умолчанию — mirror.yandex.ru/altlinux (http). При желании
# переопределить: укажите здесь APT_MIRROR (например, своё зеркало или
# file:///путь/до/work/apt.d/localrepo для локального) и/или APT_PROTO (https|http).
APT_MIRROR=""
APT_PROTO=""

# Целевая архитектура образа: i586 | x86_64 | aarch64 | armh
# Для armh/aarch64 понадобится qemu-usermode (см. README).
ARCH="x86_64"

# Графическое окружение собираемого образа:
#   gnome    - GNOME (по умолчанию)
#   cinnamon - Cinnamon
#   plasma   - KDE Plasma (в метапрофиле: distro/regular-kde)
# Образ на выходе будет alt-<de>-<дата>-<архитектура>.iso.
DESKTOP="gnome"

# Цель (target) сборки mkimage-profiles (обычно менять не нужно):
#   distro/alt-<де>.iso - собственный профиль на базе штатного regular-<де>
#                         (GNOME/Cinnamon/KDE), учитывает все правки из
#                         config/branding.conf и config/packages.conf;
#   distro/regular-gnome.iso - штатный профиль "как в релизе ALT",
#                              пользовательские правки НЕ применяются.
# Пусто = по умолчанию формируется из DESKTOP.
# Имя образа на выходе будет <имя_цели>-<дата>-<архитектура>.iso
TARGET=""

# Каталог, куда складываются готовые образы (по умолчанию: out/ проекта)
IMAGEDIR=""

# Уровень ISO-9660 для mkisofs/xorriso: 1 | 2 | 3 | 4 (пусто = 2)
# 3/4 включают поддержку больших файлов и длинных имён; для UDF не нужно.
ISO_LEVEL=""

# Режим сжатия squashfs: пусто=normal (xz) | tight (xz, дольше, меньше) | fast
SQUASHFS=""

# Версия дистрибутива, добавляется к имени образа и в метаданные.
# Пример: DISTRO_VERSION="1"  ->  alt-gnome-1-20260912-x86_64.iso
DISTRO_VERSION=""

# Префикс статуса сборки в имени образа: alpha | beta | rc | ...
STATUS=""

# Проверка конфигурации БЕЗ сборки самого образа:
#   пусто - проверка не выполняется;
#   0     - проверяется только формирование конфигурации;
#   1     - полная проверка (списки пакетов и прочее).
CHECK=""

# Отладочный режим mkimage-profiles: 1 | 2 (пусто = выкл).
# При DEBUG=1 лог сборки выводится на экран, отключается автоочистка.
DEBUG=""

# После успешной сборки удалять историю сборки (экономия места):
# 1 = включить (по умолчанию), пусто = выкл.
# Удаляются временное BUILD-дерево mkimage и старые журналы (остаются 3 последних);
# готовые ISO и профиль не затрагиваются. При DEBUG=1 не выполняется.
AUTOCLEAN="1"