# =====================================================================
#  Настройки брендирования образа (внешний вид и "лицо" дистрибутива)
# =====================================================================

# --- Режим брендирования --------------------------------------------
#   auto  (по умолчанию) - используются брендинговые пакеты ALT Linux
#                          из репозитория (простой и надёжный путь);
#   repo  - собирается собственный набор пакетов branding-<имя>-*
#           из каталога branding-template с последующей укладкой их
#           в локальный apt-репозиторий (см. tools/mk-branding.sh);
#   files - файлы из каталога profile/branding/files копируются в корень
#           файловой системы инсталлятора (только текстовые правки
#           гарантированны; графические ресурсы системы - только через
#           брендинг-пакеты, см. README).
#
# ВНИМАНИЕ (режим repo): если в branding-template/ есть какое-либо
# содержимое (например, картинки для рабочего стола в graphics/),
# а значение BRANDING_MODE НЕ равно repo, это содержимое в образ НЕ
# попадает - при сборке будет выведено соответствующее предупреждение.
# Пакеты брендинга пересобираются автоматически только при реальном
# изменении branding-template/ (по отпечатку), а не при каждом прогоне.
BRANDING_MODE="auto"

# --- Имя бренда (BRANDING) -------------------------------------------
# В образ автоматически устанавливаются пакеты вида
#   branding-<BRANDING>-{release, alterator, bootsplash, bootloader,
#                         graphics, indexhtml, notes, slideshow}
# Готовые брендинги в репозиториях ALT:
#   alt-starterkit   - брендинг стартеркитов (ветки p9/p10 и им подобные)
#   alt-sisyphus     - брендинг Сизифа
# Для BRANDING_MODE=repo задайте здесь ИМЯ СВОЕГО брендинга (без префикса
# branding-), например: BRANDING="mycompany"
BRANDING="alt-sisyphus"

# --- Локальный apt-репозиторий собственного брендинга (BRANDING_MODE=repo) ------
# Каталог, куда tools/mk-branding.sh складывает собранные пакеты. При сборке
# он добавляется в apt ДОПОЛНИТЕЛЬНО к основному зеркалу ветки (не вместо него)
# как источник "local" (без проверки подписи). Обычно менять не требуется.
BRANDING_LOCAL_REPO="work/apt.d/localrepo"

# --- Компоненты брендинга (THE_BRANDING) ------------------------------
# Какие подмножества пакетов branding-<BRANDING>-* попадают
# в установленную систему и Live-сессию. Базово берутся все:
THE_BRANDING="alterator graphics indexhtml notes bootsplash bootloader slideshow"

# --- Человекочитаемое название дистрибутива --------------------------
# Используется:
#   * как заголовок загрузчика (grub/syslinux) - в 999-alt-desktop.mk
#     делается set RELNAME переопределяющий значение родительского профиля;
#   * в hook-файле /etc/custom-brand и в NAME/PRETTY_NAME файла
#     /usr/lib/os-release собранного образа (live-сессия);
#   * передаётся в переменных make сборки (RELNAME).
# Для установленной системы название задаёт пакет branding-<BRANDING>-release
# (обычный путь - BRANDING_MODE=repo и tools/mk-branding.sh --name=...):
# поправить этот файл недостаточно - см. README, раздел "Брендирование".
RELNAME="ALEX ALT GNOME (custom build)"

# --- Организация-изготовитель ---------------------------------------
# Подставляется в ISO-метаданные (META_PUBLISHER / -publisher).
VENDOR_NAME="MyOrg"

# --- BRANDING_MODE=files: источник файлов -----------------------------
# Каталог (относительно корня проекта) с файлами, которые будут
# скопированы в корень ФС инсталлятора образа. Структура каталога
# повторяет дерево / той системы.
# Например:
#   profile/branding/files/etc/os-release            -> /etc/os-release
#   profile/branding/files/usr/share/pixmaps/logo.png -> /usr/share/pixmaps/...
# Если каталога нет или он пуст - эта стадия пропускается.
BRANDING_FILES_DIR="profile/branding/files"
